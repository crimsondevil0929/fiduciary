[project]
name = "interlock-fiduciary"
version = "1.1.0"
description = "Signed mandates, quorum warrants and offline compliance proofs over Interlock and AgentGov."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Edward Gu", email = "edwardgu0929@gmail.com" }]
keywords = ["agents", "llm", "delegation", "quorum", "audit", "zero-trust", "escrow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "interlock-escrow>=1.0.4",
    # Signing is part of every install: keygen, approve, the service and the demo sign.
    "interlock-agentgov[sign]>=1.0.0",
]

[project.scripts]
fiduciary = "fiduciary.cli:main_entry"

[project.optional-dependencies]
# The PostgreSQL store (fiduciary.postgres), and AgentGov and Interlock on PostgreSQL.
postgres = ["psycopg[binary]>=3.2", "interlock-escrow[postgres]>=1.0.4"]
# Signing with an Ed25519 key held locally. In the base install since 1.1.0; the
# extra stays so that `interlock-fiduciary[sign]` still resolves.
sign = ["interlock-agentgov[sign]>=1.0.0"]
# Signing with an Ed25519 key held by AWS KMS (agentgov.receipts.kms_aws.AwsKmsSigner).
kms-aws = ["interlock-agentgov[kms-aws]>=1.0.0"]
# AgentGov's OpenTelemetry metrics, for the governor fiduciary anchors into.
otel = ["interlock-agentgov[otel]>=1.0.0"]
# The Cedar policy engine, for the input gateway `fiduciary demo` compares with;
# without it the demo's built-in evaluator of the same policies decides.
cedar = ["cedarpy>=4.12"]
# `fiduciary demo` with the Cedar engine (the demo runs without it too).
demo = ["cedarpy>=4.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "psycopg[binary]>=3.2",
    "hypothesis>=6.100",
    "cryptography>=42",
    "cedarpy>=4.12",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
faulthandler_timeout = 300
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["fiduciary"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "@overload"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The specification's code blocks are illustrations, laid out for reading.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests sign with secrets they make up, which name nothing real (S105, S106),
# build SQL from table names they define themselves to tamper with fixtures
# (S608), and draw mandates from seeded generators so a case reproduces (S311).
"tests/**/*.py" = ["S101", "S105", "S106", "S311", "S608"]
# The stores join their own table names, module constants, into constant SQL;
# every value is a bound parameter.
"src/fiduciary/sqlite.py" = ["S608"]
"src/fiduciary/postgres.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["fiduciary"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.hatch.build.targets.wheel]
packages = ["src/fiduciary"]

[tool.hatch.build.targets.sdist]
# Working notes for whoever builds the next phase: untracked, and not part of a release.
exclude = ["/HANDOFF.md", "/AGENTS.md", "/CLAUDE.md", "/STRATEGY_AND_MOAT.md", "/.env.benchmark", "/live-run", "/soak"]
